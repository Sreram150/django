<!DOCTYPE html>
<html>

<head>

    <title>Edit Product</title>

</head>

<body>

<h1>Edit Product</h1>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        value="{{ product.name }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="category"
        value="{{ product.category }}"
        required
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ product.price }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="stock"
        value="{{ product.stock }}"
        required
    >

    <br><br>

    <textarea
        name="description"
    >{{ product.description }}</textarea>

    <br><br>

    <button type="submit">
        Update Product
    </button>

</form>

<br>

<a href="/admin-dashboard/">
    Back to Dashboard
</a>

</body>

</html>
