<!DOCTYPE html>
<html>

<head>

    <title>Add Product</title>

</head>

<body>

<h1>Add Product</h1>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        placeholder="Product Name"
        required
    >

    <br><br>

    <input
        type="text"
        name="category"
        placeholder="Category"
        required
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="price"
        placeholder="Price"
        required
    >

    <br><br>

    <input
        type="number"
        name="stock"
        placeholder="Stock"
        required
    >

    <br><br>

    <textarea
        name="description"
        placeholder="Product Description"
    ></textarea>

    <br><br>

    <button type="submit">
        Add Product
    </button>

</form>

<br>

<a href="/admin-dashboard/">
    Back to Dashboard
</a>

</body>

</html>
